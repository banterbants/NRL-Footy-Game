name: Build Sixth Tackle for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'rugby-league-pc/**'
      - '.github/workflows/build-pc.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rugby-league-pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rugby-league-pc/package-lock.json
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: SixthTackle-Windows
          path: rugby-league-pc/release/Sixth Tackle-win32-x64
          if-no-files-found: error
